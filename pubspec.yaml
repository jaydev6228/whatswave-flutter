name: whatswave
description: WhatsApp-style Flutter architecture and UI foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.3
  video_player: ^2.11.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  flutter_twemoji: ^1.1.0
  # Pinned exact (not ^4.12.1) -- pub's solver otherwise happily picks
  # firebase_core 4.13.0+, which bumps its native firebase-ios-sdk pin to
  # 12.17.0 and conflicts with firebase_storage (and every other firebase_*
  # package here) at 12.15.0. See the firebase_storage pin below for the
  # full explanation -- bump this only alongside every other firebase_*
  # dependency, together.
  firebase_core: 4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  flutter_contacts: ^2.3.1
  firebase_messaging: ^16.4.3
  livekit_client: ^2.9.0
  http: ^1.6.0
  # Resolves an upload's content type from its filename, so Storage stores
  # and serves it as what it is -- see resolveUploadContentType. Already in
  # the tree transitively (via http/firebase); promoted to a direct
  # dependency because this app now imports it directly.
  mime: ^2.0.0
  # Disk cache for remote status/chat media -- see status_media_source.dart.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_ringtone_player: ^4.0.0+4
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  # Pinned to 13.4.5 (not the newer 13.4.6) -- 13.4.6 bumps its native
  # firebase-ios-sdk requirement to 12.17.0, which conflicts with every
  # other Firebase plugin in this project (firebase_core, firebase_auth,
  # cloud_firestore, firebase_crashlytics, firebase_analytics,
  # firebase_messaging), all still pinned to 12.15.0 -- Swift Package
  # Manager can't resolve two different exact versions of the same native
  # SDK package at once. Bump this only alongside bumping every other
  # firebase_* dependency above to versions that also want 12.17.0+.
  firebase_storage: 13.4.5
  # Calls the deleteAccount callable. The callable protocol could be done
  # by hand over `http`, but that means hardcoding the region URL and
  # reimplementing error mapping -- first-party plugin is the smaller risk.
  cloud_functions: ^6.0.3
  # Share sheet for the attachment viewer. First-party flutter.dev plugin.
  share_plus: ^12.0.1
  # Pinned to 10.3.10 (not ^11.x) -- 11.0.0+'s android/build.gradle stopped
  # applying the kotlin-android plugin, breaking every Android build with
  # "cannot find symbol FilePickerPlugin" (a confirmed upstream regression,
  # see miguelpruivo/flutter_file_picker#1952 and #1973). 10.3.10 is the
  # last version before the regression that also carries the earlier
  # 10.3.9 fix for the same class of issue.
  file_picker: 10.3.10
  # Opens a document attachment in the OS's own native viewer -- QuickLook
  # on iOS, an Intent chooser on Android -- as the fallback for formats
  # (Word/Excel/PowerPoint) with no practical in-app renderer here.
  open_filex: ^4.7.0
  # Real in-app PDF rendering (pinch-zoom, page scroll) instead of handing
  # every PDF off to the OS viewer -- MIT-licensed, no commercial license
  # required (unlike some other Flutter PDF viewers).
  pdfx: ^2.9.2
  # On-device video thumbnail generation -- a maintained fork of
  # video_thumbnail with the same API, whose Android build no longer
  # depends on the shut-down jcenter() repo (unlike the original package,
  # which failed every Android build -- see git history).
  get_video_thumbnail: ^0.9.0
  # Renders a real, interactive OpenStreetMap-tiled map with a pin for
  # location attachments -- no API key/billing setup required, unlike
  # Google Maps' own Flutter map widget.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # Real microphone recording for voice notes (AVAudioRecorder on iOS,
  # MediaRecorder on Android) -- handles its own mic-permission request.
  record: ^6.1.1
  # Full emoji-keyboard-style picker (search, recent, categories, grid) for
  # the reaction tray's "+" button -- pure Dart/Flutter widget, no native
  # platform code, so it carries none of this project's past native-build
  # risk (see file_picker/get_video_thumbnail comments above).
  emoji_picker_flutter: ^4.3.0
  # Saves a photo/video attachment to the device's own gallery -- "Save"
  # in a message's long-press menu.
  gal: ^2.3.1
  crop_your_image: ^2.0.0
  # Real authentication behind the app lock (Face ID / Touch ID / fingerprint,
  # falling back to the device passcode). First-party flutter.dev plugin.
  # Two native prerequisites, both done -- they fail at runtime, not build
  # time, so they are easy to miss: Android MainActivity must extend
  # FlutterFragmentActivity (BiometricPrompt is a Fragment), and iOS needs
  # NSFaceIDUsageDescription in Info.plist or the OS denies Face ID outright.
  local_auth: ^2.3.0
  # End-to-end encryption. Pure Dart (mixin.dev, verified publisher), so it
  # adds no native build surface -- which matters in this project, where
  # file_picker and get_video_thumbnail have both had to be pinned or
  # forked around native regressions -- and it runs inside `flutter test`
  # with no platform channels, which the whole test strategy depends on.
  #
  # GPL-3.0. This is why LICENSE is GPL-3.0 rather than proprietary: every
  # maintained Signal Protocol implementation for Dart is copyleft, and the
  # alternative was hand-writing X3DH + Double Ratchet, which is exactly
  # the code you do not want to be the author of.
  libsignal_protocol_dart: ^0.8.2
  # Identity keys, session state and the local data key. iOS Keychain /
  # Android Keystore.
  #
  # Held at 10.x deliberately. 11.x wants win32 ^6, file_picker 10.3.10
  # wants win32 ^5, and file_picker cannot move (11.x breaks every Android
  # build -- see its pin above). Forcing win32 forward does not stop at
  # win32: win32_registry and device_info_plus both fail to compile against
  # it, and the breakage is not confined to Windows -- it fails the whole
  # test suite. Three overrides across unrelated packages is too much
  # instability for the gain.
  #
  # What 10.x costs is less than it looks: its Android defaults are already
  # RSA-OAEP key wrapping over AES-GCM, the same ciphers 11.x uses. The
  # deprecated Jetpack EncryptedSharedPreferences backend is opt-IN via
  # `encryptedSharedPreferences: true`, which this app does not set. Move to
  # 11.x once file_picker can leave 10.3.10.
  flutter_secure_storage: ^10.3.4
  # Argon2id for the passphrase-encrypted key backup, and AES/HMAC for
  # media. Already resolved transitively; promoted because this app now
  # imports it directly.
  pointycastle: ^4.0.0
  # Local plaintext message store. A Signal ciphertext decrypts exactly
  # once, so re-reading a message doc has to be served from disk rather
  # than decrypted again -- see docs. Already in the tree via
  # flutter_cache_manager.
  sqflite: ^2.4.1
  # SHA-256 over a message ciphertext, so the local plaintext store can tell
  # an edit (same message id, new ciphertext) from a re-read. Already in the
  # tree transitively; promoted because this app imports it directly.
  crypto: ^3.0.6
  # Joining database paths. Already in the tree via path_provider/sqflite;
  # promoted because this app imports it directly.
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image_picker_platform_interface: ^2.11.1
  path_provider_platform_interface: ^2.1.2
  # Only so tests can construct flutter_cache_manager's own FileInfo, whose
  # file field is this package's File rather than dart:io's.
  file: ^7.0.1
  # Lets tests stand in a fake video_player platform (test/support), so
  # playback behaviour is coverable without a device.
  video_player_platform_interface: ^6.9.0
  # setupFirebaseCoreMocks(), so a test can construct the firebase-first
  # repositories -- see test/support/firebase_core_mocks.dart.
  firebase_core_platform_interface: ^8.1.0
  # A real SQLite for tests: sqflite itself is a platform channel and has no
  # implementation in the Dart VM, so the Signal store would be untestable
  # without it.
  sqflite_common_ffi: ^2.3.4
  # In-memory Firestore for tests, so the key-backup and identity services
  # are coverable without the emulator (the rules suite covers the rules
  # themselves; this covers the client logic on top of them).
  fake_cloud_firestore: ^4.0.0
  # Companion to fake_cloud_firestore: FirestoreChatRepository reads the
  # signed-in uid straight off FirebaseAuth, so covering the encrypted
  # send/read path needs a stand-in for it.
  firebase_auth_mocks: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/media/status_demo/
    - assets/layout/shapes/
  # The single UI typeface for the whole app (see AppTheme._uiFontFamily).
  # Bundled locally instead of via the google_fonts package's runtime HTTP
  # fetch -- that fetch needs a live Flutter binding (breaks plain `test()`
  # theme unit tests) and a network round-trip on first launch, neither of
  # which fits an otherwise fully offline-capable theme. InterVariable.ttf
  # is a single variable-weight file; declaring it once per weight actually
  # used lets Skia render the correct instance for each.
  fonts:
    # Bundled so a text status looks the same everywhere. The story canvas
    # used the generic aliases 'serif' and 'monospace', which iOS resolves to
    # Times and Android to Noto Serif -- different metrics, different
    # wrapping, a story that did not match what its author composed.
    # Both are SIL Open Font License, same as Inter.
    - family: StorySerif
      fonts:
        - asset: assets/fonts/noto_serif/NotoSerif.ttf
    - family: StoryMono
      fonts:
        - asset: assets/fonts/roboto_mono/RobotoMono.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 500
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 700
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 800

