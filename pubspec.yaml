name: whatswave
description: WhatsApp-style Flutter architecture and UI foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.3
  video_player: ^2.11.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  flutter_twemoji: ^1.1.0
  # Pinned exact (not ^4.12.1) -- pub's solver otherwise happily picks
  # firebase_core 4.13.0+, which bumps its native firebase-ios-sdk pin to
  # 12.17.0 and conflicts with firebase_storage (and every other firebase_*
  # package here) at 12.15.0. See the firebase_storage pin below for the
  # full explanation -- bump this only alongside every other firebase_*
  # dependency, together.
  firebase_core: 4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  flutter_contacts: ^2.3.1
  firebase_messaging: ^16.4.3
  livekit_client: ^2.9.0
  http: ^1.6.0
  flutter_ringtone_player: ^4.0.0+4
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  # Pinned to 13.4.5 (not the newer 13.4.6) -- 13.4.6 bumps its native
  # firebase-ios-sdk requirement to 12.17.0, which conflicts with every
  # other Firebase plugin in this project (firebase_core, firebase_auth,
  # cloud_firestore, firebase_crashlytics, firebase_analytics,
  # firebase_messaging), all still pinned to 12.15.0 -- Swift Package
  # Manager can't resolve two different exact versions of the same native
  # SDK package at once. Bump this only alongside bumping every other
  # firebase_* dependency above to versions that also want 12.17.0+.
  firebase_storage: 13.4.5
  # Pinned to 10.3.10 (not ^11.x) -- 11.0.0+'s android/build.gradle stopped
  # applying the kotlin-android plugin, breaking every Android build with
  # "cannot find symbol FilePickerPlugin" (a confirmed upstream regression,
  # see miguelpruivo/flutter_file_picker#1952 and #1973). 10.3.10 is the
  # last version before the regression that also carries the earlier
  # 10.3.9 fix for the same class of issue.
  file_picker: 10.3.10
  # Opens a document attachment in the OS's own native viewer -- QuickLook
  # on iOS, an Intent chooser on Android -- as the fallback for formats
  # (Word/Excel/PowerPoint) with no practical in-app renderer here.
  open_filex: ^4.7.0
  # Real in-app PDF rendering (pinch-zoom, page scroll) instead of handing
  # every PDF off to the OS viewer -- MIT-licensed, no commercial license
  # required (unlike some other Flutter PDF viewers).
  pdfx: ^2.9.2
  # On-device video thumbnail generation -- a maintained fork of
  # video_thumbnail with the same API, whose Android build no longer
  # depends on the shut-down jcenter() repo (unlike the original package,
  # which failed every Android build -- see git history).
  get_video_thumbnail: ^0.9.0
  # Renders a real, interactive OpenStreetMap-tiled map with a pin for
  # location attachments -- no API key/billing setup required, unlike
  # Google Maps' own Flutter map widget.
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  # Real microphone recording for voice notes (AVAudioRecorder on iOS,
  # MediaRecorder on Android) -- handles its own mic-permission request.
  record: ^6.1.1
  # Full emoji-keyboard-style picker (search, recent, categories, grid) for
  # the reaction tray's "+" button -- pure Dart/Flutter widget, no native
  # platform code, so it carries none of this project's past native-build
  # risk (see file_picker/get_video_thumbnail comments above).
  emoji_picker_flutter: ^4.3.0
  # Saves a photo/video attachment to the device's own gallery -- "Save"
  # in a message's long-press menu.
  gal: ^2.3.1
  crop_your_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image_picker_platform_interface: ^2.11.1
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/media/status_demo/
  # The single UI typeface for the whole app (see AppTheme._uiFontFamily).
  # Bundled locally instead of via the google_fonts package's runtime HTTP
  # fetch -- that fetch needs a live Flutter binding (breaks plain `test()`
  # theme unit tests) and a network round-trip on first launch, neither of
  # which fits an otherwise fully offline-capable theme. InterVariable.ttf
  # is a single variable-weight file; declaring it once per weight actually
  # used lets Skia render the correct instance for each.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 500
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 700
        - asset: assets/fonts/inter/InterVariable.ttf
          weight: 800

flutter_twemoji:
  # Must stay 1:1 with the curated `_emojiCategories` set in
  # media_status_composer_screen.dart -- flutter_twemoji only bundles
