name: whatswave
description: WhatsApp-style Flutter architecture and UI foundation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.3
  video_player: ^2.11.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  flutter_twemoji: ^1.1.0
  # Pinned exact (not ^4.12.1) -- pub's solver otherwise happily picks
  # firebase_core 4.13.0+, which bumps its native firebase-ios-sdk pin to
  # 12.17.0 and conflicts with firebase_storage (and every other firebase_*
  # package here) at 12.15.0. See the firebase_storage pin below for the
  # full explanation -- bump this only alongside every other firebase_*
  # dependency, together.
  firebase_core: 4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  flutter_contacts: ^2.3.1
  firebase_messaging: ^16.4.3
  livekit_client: ^2.9.0
  http: ^1.6.0
  flutter_ringtone_player: ^4.0.0+4
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  # Pinned to 13.4.5 (not the newer 13.4.6) -- 13.4.6 bumps its native
  # firebase-ios-sdk requirement to 12.17.0, which conflicts with every
  # other Firebase plugin in this project (firebase_core, firebase_auth,
  # cloud_firestore, firebase_crashlytics, firebase_analytics,
  # firebase_messaging), all still pinned to 12.15.0 -- Swift Package
  # Manager can't resolve two different exact versions of the same native
  # SDK package at once. Bump this only alongside bumping every other
  # firebase_* dependency above to versions that also want 12.17.0+.
  firebase_storage: 13.4.5
  file_picker: ^11.0.3
  # Opens a document attachment (PDF/Word/Excel/CSV/etc) in the OS's own
  # native viewer -- QuickLook on iOS, an Intent chooser on Android --
  # rather than hand-building a renderer per file format.
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/status_music/
    - assets/media/status_demo/

flutter_twemoji:
  includes:
    - "🔥"
    - "✨"
    - "😍"
    - "🎉"
    - "🤍"
    - "😎"
    - "🌙"
    - "☕️"
    - "📍"
    - "🎧"
    - "🌈"
    - "💫"
